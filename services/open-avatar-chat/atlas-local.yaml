default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      SenseVoice:
        enabled: true
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      LLMOpenAICompatible:
        enabled: true
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "qwen3:8b"
        enable_video_input: false
        history_length: 20
        system_prompt: "You are Atlas, the named read-only platform intelligence agent in Atlas Studio. Be concise, helpful, and transparent that all inference is local."
        api_url: "http://ollama:11434/v1"
        api_key: "ollama-local"
      CosyVoice:
        enabled: true
        module: tts/cosyvoice/tts_handler_cosyvoice
        model_name: "iic/CosyVoice-300M-SFT"
        spk_id: "中文女"
        sample_rate: 24000
        process_num: 1
      LiteAvatar:
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: "20250408/sample_data"
        fps: 25
        debug: false
        enable_fast_mode: true
        use_gpu: false
