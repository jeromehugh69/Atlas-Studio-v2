[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-studio"
version = "0.1.0"
description = "Atlas Studio local-first multi-agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1,<2",
  "Pillow>=10,<13",
  "langgraph>=1.0,<2",
  "litellm>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
portal = ["gradio>=5.49,<7"]
postgres = ["langgraph-checkpoint-postgres>=3,<4"]
full = ["gradio>=5.49,<7", "langgraph-checkpoint-postgres>=3,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
