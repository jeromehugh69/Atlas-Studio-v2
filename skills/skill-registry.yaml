# Atlas Studio Skill Registry
# Defines available skills, their API key requirements, and delegation rules.
# All skills use ONLY trusted sources (OpenAI, government, official policies, compliance, open-source repos).

skills:
  atlas-request-intake:
    name: atlas-request-intake
    display_name: "Atlas Request Intake"
    description: "Receive and scope Atlas Studio user requests with minimal friction"
    tier: 1  # Always loaded (system prompt level)
    free: true
    api_keys: []  # No external API keys required
    local_only: true
    agents:
      - atlas
    delegates_to:
      - development-lifecycle
      - manage-atlas-platform
    description_triggers:
      - "user request"
      - "follow-up"
      - "correction"
      - "investigation"
      - "feature request"
      - "platform change"
