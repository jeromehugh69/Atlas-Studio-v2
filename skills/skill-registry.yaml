# Delegation Rules:
# When a skill receives a request outside its domain, it delegates to the appropriate skill.
# Delegation is automatic and follows the governance rules in development-lifecycle.
delegation_rules:
  - trigger: "user makes a change request"
    from: atlas-request-intake
    to: development-lifecycle
  - trigger: "user wants to manage a platform record"
    from: atlas-request-intake
    to: manage-atlas-platform
  - trigger: "implementation requires platform record change"
    from: development-lifecycle
    to: manage-atlas-platform
  - trigger: "platform change requires governance"
    from: manage-atlas-platform
    to: development-lifecycle
  - trigger: "research findings need implementation"
    from: sage-research
    to: development-lifecycle
  - trigger: "legal review needed for implementation"
    from: counsel-legal
    to: development-lifecycle
  - trigger: "documentation needed for implementation"
    from: scribe-documents
    to: development-lifecycle
  - trigger: "visual assets needed for implementation"
    from: pixel-visual
    to: development-lifecycle
  - trigger: "architecture design needs implementation"
    from: blueprint-architecture
    to: development-lifecycle
  - trigger: "API design needs implementation"
    from: nexus-integration
    to: development-lifecycle
  - trigger: "data model needs implementation"
    from: datacore-data
    to: development-lifecycle
  - trigger: "UX design needs implementation"
    from: interface-ux
    to: development-lifecycle
  - trigger: "voice setup needs implementation"
    from: echo-voice
    to: development-lifecycle

# Standard Response Format:
# Agents generate internal audit reasoning AND a clean user-facing response.
# The user-facing response is what gets shown to the user.
# The audit fields are stripped from output and stored separately.
response_format:
  audit_fields:
    - REQUEST       # What was asked
    - INTERPRETATION # How the agent understood it
    - EVIDENCE      # Sources, citations, test results
    - ACTION_TAKEN  # What was done
    - VERIFICATION  # How the result was confirmed
    - AUDIT         # Audit trail entry reference
  optional_audit_fields:
    - APPROVAL_REQUIRED  # What needs user authorization
    - NEXT              # Recommended follow-ups
    - DELEGATION        # If request was delegated to another skill
  user_facing:
    description: >
      After the audit fields, write a clean, direct, natural-language response
      to the user. This is the only part shown to the user. Do not include
      field labels in the user-facing section.
